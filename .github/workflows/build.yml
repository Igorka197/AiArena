name: Build mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: playeregg-jar
          path: build/libs/*.jar

      - name: Publish release
        if: github.ref == 'refs/heads/arena/01a07890-aiarena'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Player Spawn Egg (latest build)
          body: "Fabric 1.20.1 — яйцо призыва игрока. Требуется Fabric Loader 0.15+ и Fabric API."
          files: build/libs/*.jar
